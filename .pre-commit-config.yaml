default_install_hook_types:
  - commit-msg
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: name-tests-test
      - id: no-commit-to-branch
      - id: trailing-whitespace

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            --strict,
            --force-scope,
            --scopes,
            "docker,api,playlist,scraper,config,deps,ci,docs",
          ]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      # The hook's default entry (ghcr.io/hadolint/hadolint hadolint) has no
      # image tag, which Docker resolves to :latest - an untracked moving
      # target independent of the `rev:` above. That let CI and a local
      # machine run genuinely different hadolint builds and disagree on the
      # same unchanged Dockerfile. Pinning the tag to match `rev:` makes the
      # image deterministic with the hook version.
      - id: hadolint-docker
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      # Fails the commit when uv.lock no longer matches pyproject.toml.
      - id: uv-lock

  # The Python tools run from the project venv (`uv run`), pinned once in uv.lock,
  # so the hooks check against the same dependency versions the app and tests use.
  # --locked syncs the venv first and fails on a stale lock instead of rewriting it.
  - repo: local
    hooks:
      # Ruff settings live in pyproject.toml. Both hooks run over the whole project,
      # the files ruff itself finds, so the hook and a bare `ruff check` agree.
      # The formatter also formats the Python code blocks in Markdown files.
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi, markdown]
        pass_filenames: false

      # Linting reports and never fixes; `uv run ruff check --fix` applies the
      # safe fixes by hand. Ruff also reports syntax errors, so no check-ast.
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false

      - id: check-python-version
        name: Check Python version consistency
        entry: scripts/check-python-version.sh
        language: system
        files: '^(\.python-version|Dockerfile|docker-compose\.yml|pyrightconfig\.json|pyproject\.toml)$'
        pass_filenames: false

      - id: check-hadolint-pin
        name: Check hadolint's image tag matches its rev
        entry: python3 scripts/check_hadolint_pin.py
        language: system
        files: '^\.pre-commit-config\.yaml$'
        pass_filenames: false

      - id: pytest
        name: pytest (with coverage)
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        # Only run when code/tests/deps change (skip doc-only commits).
        files: '^(src/|scripts/|tests/|pytest\.ini|pyproject\.toml|uv\.lock)'
        # Coverage floor lives here (not in pytest.ini addopts) so ad-hoc/partial
        # runs aren't tripped. It is a regression guard, set below what the suite
        # achieves.
        args:
          - "--cov=webcam_aggregator"
          - "--cov-report=term-missing"
          - "--cov-fail-under=85"

      - id: vulture
        name: vulture (dead code)
        # Settings in pyproject.toml's [tool.vulture]. It reads the whole package
        # every run, since dead code is a property of the package, not of a file.
        entry: uv run --locked vulture
        language: system
        files: '^src/'
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: uv run --locked basedpyright
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.2
    hooks:
      - id: markdownlint-cli2
