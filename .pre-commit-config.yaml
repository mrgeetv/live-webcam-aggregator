default_install_hook_types:
  - commit-msg
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: name-tests-test
      - id: no-commit-to-branch
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            --strict,
            --force-scope,
            --scopes,
            "docker,api,playlist,scraper,config,deps,ci,docs",
          ]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        # --extend-ignore (not --ignore) keeps flake8's black-compatible defaults
        # (E704, W503, …) and just adds E501/E203 on top — per black's guidance.
        args: ["--extend-ignore=E501,E203"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      # The hook's default entry (ghcr.io/hadolint/hadolint hadolint) has no
      # image tag, which Docker resolves to :latest - an untracked moving
      # target independent of the `rev:` above. That let CI and a local
      # machine run genuinely different hadolint builds and disagree on the
      # same unchanged Dockerfile. Pinning the tag to match `rev:` makes the
      # image deterministic with the hook version.
      - id: hadolint-docker
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint

  - repo: local
    hooks:
      - id: check-python-version
        name: Check Python version consistency
        entry: scripts/check-python-version.sh
        language: system
        files: '^(\.python-version|Dockerfile|docker-compose\.yml|pyrightconfig\.json)$'
        pass_filenames: false

      - id: check-hadolint-pin
        name: Check hadolint's image tag matches its rev
        entry: python3 scripts/check_hadolint_pin.py
        language: system
        files: '^\.pre-commit-config\.yaml$'
        pass_filenames: false

      - id: pytest
        name: pytest (with coverage)
        # The wrapper prefers .venv/bin/pytest and falls back to PATH, so the hook
        # works whatever shell state the commit runs from (agents, editor git UIs, CI).
        entry: scripts/run-pytest.sh
        language: system
        pass_filenames: false
        # Only run when code/tests/deps change (skip doc-only commits).
        files: '^(src/|scripts/|tests/|pytest\.ini|requirements.*\.txt)'
        # Coverage floor lives here (not in pytest.ini addopts) so ad-hoc/partial
        # runs aren't tripped; floor sits a few points below the achieved ~88%.
        args:
          - "--cov=webcam_aggregator"
          - "--cov-report=term-missing"
          - "--cov-fail-under=85"

  # Upstream's own hook repo rather than a local hook: Dependabot skips local hooks,
  # so a pin there would never be bumped.
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        name: vulture (dead code)
        files: '^src/'
        # confidence 60 catches dead functions/attributes/fields (not just imports,
        # which flake8/basedpyright already get). Framework-dispatched HTTP-handler
        # methods (do_GET/log_message) are false positives, so ignore them by name.
        args:
          - "src/webcam_aggregator/"
          - "--min-confidence"
          - "60"
          - "--ignore-names"
          - "do_GET,log_message"

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 1.39.8
    hooks:
      - id: basedpyright
        additional_dependencies:
          - google-api-python-client-stubs==1.37.0
          - types-psutil==7.2.2.20260518
          - types-requests==2.33.0.20260518
          - pytest==9.1.1  # so basedpyright can resolve pytest types in tests/
          - curl_cffi==0.17.0  # fetch.py imports it; ships its own type hints
