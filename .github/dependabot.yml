version: 2
updates:
  # Python dependencies - Friday morning for weekend review
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Etc/UTC"
    groups:
      python-dependencies:
        patterns:
          - "*"
    # Proper conventional commit format for strict validation
    commit-message:
      prefix: "fix(deps)"

  # GitHub Actions - Weekly on Friday
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Etc/UTC"
    # chore, not fix: semantic-release treats fix as a patch release, so an
    # actions bump would mint a version and rebuild the image despite shipping
    # nothing. chore is release:false in .releaserc. pip and docker stay on
    # fix — those do change what ends up in the image.
    commit-message:
      prefix: "chore(deps)"

  # Docker base images - Weekly on Friday
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "fix(deps)"
