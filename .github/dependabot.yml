version: 2
updates:
  # Python dependencies. yt-dlp breaks whenever YouTube changes its player, and a
  # release is the only fix, so it is checked every weekday and exempt from the
  # cooldown (without one, dependabot applies its own default). Everything else
  # waits out a 7-day cooldown. One pip block only: GitHub rejects a second block that
  # overlaps this one's directory.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      exclude:
        - "yt-dlp"
        - "yt-dlp-ejs"
    groups:
      # first matching group wins, so this must stay above the catch-all
      youtube-extraction:
        patterns:
          - "yt-dlp"
          - "yt-dlp-ejs"
      python-dependencies:
        patterns:
          - "*"
    # Proper conventional commit format for strict validation
    commit-message:
      prefix: "fix(deps)"

  # GitHub Actions - Weekly on Friday
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Etc/UTC"
    # chore, not fix: semantic-release treats fix as a patch release, so an
    # actions bump would mint a version and rebuild the image despite shipping
    # nothing. chore is release:false in .releaserc. pip and docker stay on
    # fix — those do change what ends up in the image.
    commit-message:
      prefix: "chore(deps)"

  # Docker base images - Weekly on Friday
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "fix(deps)"
