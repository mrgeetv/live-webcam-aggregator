version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock). yt-dlp breaks whenever YouTube
  # changes its player, and a release is the only fix, so it is checked every weekday
  # and exempt from the cooldown (without one, dependabot applies its own default).
  # Everything else waits out a 7-day cooldown.
  - package-ecosystem: "uv"
    directory: "/"
    # Transitive pins too: uv.lock pins the whole closure the image installs, so
    # without this only the direct dependencies would ever move.
    allow:
      - dependency-type: "all"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
      exclude:
        - "yt-dlp"
        - "yt-dlp-ejs"
    groups:
      # first matching group wins, so this must stay above the catch-alls
      youtube-extraction:
        patterns:
          - "yt-dlp"
          - "yt-dlp-ejs"
      # Split by type because one runtime package in a PR makes the whole PR take
      # the production prefix.
      python-runtime:
        dependency-type: "production"
        patterns:
          - "*"
      python-dev:
        dependency-type: "development"
        patterns:
          - "*"
    # fix(deps) for what ships in the image. The dev group (the test and lint
    # tooling) ships nothing, so it takes chore, as the pre-commit block below does.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"

  # GitHub Actions - Weekly on Friday
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Etc/UTC"
    # chore, not fix: semantic-release treats fix as a patch release, so an
    # actions bump would mint a version and rebuild the image despite shipping
    # nothing. chore is release:false in .releaserc. Runtime Python packages and
    # docker stay on fix — those do change what ends up in the image.
    commit-message:
      prefix: "chore(deps)"

  # pre-commit hooks - Weekly on Friday: each hook's rev. The Python tools run as
  # local hooks from the venv, so the uv block above bumps them. hadolint's pinned
  # entry image is not touched: check-hadolint-pin fails that PR until the tag is
  # moved to match.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Etc/UTC"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    # chore: lint tooling ships nothing in the image (see the actions block).
    commit-message:
      prefix: "chore(deps)"

  # semantic-release and its plugins - Weekly on Friday. release.yml reads the
  # versions from this package.json; nothing installs it. Majors are held: they track
  # the Node version semantic-release-action runs on, and CI never runs a release, so
  # a major that needs a newer Node would merge green and fail the next release.
  - package-ecosystem: "npm"
    directory: "/tools/release"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Etc/UTC"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      release-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # Docker base images - Weekly on Friday. Only deno is visible here: the DHI python
  # images sit behind ARGs (compose swaps them for local builds), so their patches
  # are picked up by .github/workflows/base-images.yml and their version bumps are
  # manual. A deno major is held back: it can break yt-dlp-ejs's n-challenge solver,
  # which the offline test suite can't see.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "08:00"
      timezone: "Etc/UTC"
    ignore:
      - dependency-name: "denoland/deno"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"
