name: Release & Deploy

on:
  push:
    branches:
      - main
      - next # betas
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  semantic-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      image_tags: ${{ steps.image-tags.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Need full history for semantic-release

      # The versions live in tools/release/package.json, where Dependabot can bump them
      # (it opens no npm PRs for files under .github/).
      - name: Read release tool versions
        id: tools
        shell: bash
        run: |
          pkg=tools/release/package.json
          echo "semantic=$(jq -er '.devDependencies["semantic-release"]' "$pkg")" >> "$GITHUB_OUTPUT"
          {
            echo "plugins<<EOF"
            jq -er '.devDependencies | to_entries[] | select(.key != "semantic-release") | "\(.key)@\(.value)"' "$pkg"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: ${{ steps.tools.outputs.semantic }}
          extra_plugins: ${{ steps.tools.outputs.plugins }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Betas get only their own tag and :beta, never :latest or :vN.
      - name: Image tags
        id: image-tags
        if: steps.semantic.outputs.new_release_published == 'true'
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
          MAJOR: ${{ steps.semantic.outputs.new_release_major_version }}
          MINOR: ${{ steps.semantic.outputs.new_release_minor_version }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:v$VERSION"
            if [[ "$VERSION" == *-* ]]; then
              pre=${VERSION#*-}
              echo "$IMAGE:${pre%%.*}"
            else
              echo "$IMAGE:latest"
              echo "$IMAGE:v$MAJOR"
              echo "$IMAGE:v$MAJOR.$MINOR"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Release Deployment
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "## 🎉 Release Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`v${{ steps.semantic.outputs.new_release_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Major | \`${{ steps.semantic.outputs.new_release_major_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Minor | \`${{ steps.semantic.outputs.new_release_minor_version }}\` |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**🚀 New release published and Docker images will be built!**" >> $GITHUB_STEP_SUMMARY

          echo "🎉 New release published!"
          echo "Version: ${{ steps.semantic.outputs.new_release_version }}"
          echo "Major: ${{ steps.semantic.outputs.new_release_major_version }}"
          echo "Minor: ${{ steps.semantic.outputs.new_release_minor_version }}"

  docker-build-and-deploy:
    name: Build & Deploy Docker Image
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/docker-build.yml
    with:
      # The tag, not the pushed commit: the image's revision label must name the
      # release's commit, which base-images.yml checks it against.
      ref: v${{ needs.semantic-release.outputs.new_release_version }}
      tags: ${{ needs.semantic-release.outputs.image_tags }}
    secrets: inherit
