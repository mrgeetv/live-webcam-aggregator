name: CI Validation

on:
  pull_request:
    branches: [main]
  workflow_call: # Allow other workflows to call this
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  hadolint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  pre-commit:
    name: Pre-commit Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv installs the Python that .python-version names, and caches its downloads
      # keyed on uv.lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Cache pre-commit hooks
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/pre-commit/
          # Key includes Python version and config hash for proper invalidation
          key: pre-commit-${{ hashFiles('.python-version') }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ hashFiles('.python-version') }}-

      # The project venv holds pre-commit and every Python tool the hooks run.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit hooks
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  ci-summary:
    name: Validation Results
    runs-on: ubuntu-latest
    needs: [hadolint, pre-commit]
    if: always()

    steps:
      - name: CI Status
        run: |
          echo "## 🧪 CI Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Hadolint | ${{ needs.hadolint.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-commit | ${{ needs.pre-commit.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.hadolint.result }}" == "success" && "${{ needs.pre-commit.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
          else
            echo "❌ CI checks failed - please fix before proceeding"
            exit 1
          fi
