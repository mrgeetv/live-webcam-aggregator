[project]
name = "live-webcam-aggregator"
# Required by the [project] table, and never changed: releases are versioned by git tag
# and CHANGELOG (semantic-release), and nothing installs this project as a package.
version = "0"
requires-python = "==3.14.*"
dependencies = [
    "certifi==2026.10.23",
    "curl_cffi==0.17.0",
    "google-api-python-client==2.202.0",
    "google-auth-httplib2==0.4.4",
    "google-auth-oauthlib==1.5.0",
    "psutil==7.2.2",
    "requests==2.34.2",
    "yt-dlp==2026.11.23",
    "yt-dlp-ejs==0.8.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "google-api-python-client-stubs==1.40.0",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.6",
    "types-psutil==7.2.2.20261111",
    "types-requests==2.33.0.20261030",
    "vulture==2.16",
]

[tool.uv]
# Nothing installs the project itself: the image copies src/ and the tests put it on
# the path (pytest.ini), so uv only manages the dependencies.
package = false

[tool.vulture]
paths = ["src/webcam_aggregator"]
# 60 catches dead functions, attributes and fields, not just the unused imports the
# linter and type checker already report. The HTTP handler methods are called by
# the stdlib server, so they look unused; ignore them by name.
min_confidence = 60
ignore_names = ["do_GET", "log_message"]

[tool.ruff]
# Import roots: the package, the scripts the tests import, and the tests, which
# pytest imports as top-level modules (tests/ has no __init__.py).
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# Every stable rule. A rule is ignored only with its reason beside it, here or on
# the noqa that suppresses one site. Preview rules stay off: they can change in any
# patch release, which would fail the hooks on a routine version bump.
select = ["ALL"]
ignore = [
    # Conflict with the formatter (ruff docs: formatter.md, "Conflicting lint rules").
    "COM812", "COM819", "D206", "D300", "E111", "E114", "E117",
    "Q000", "Q001", "Q002", "Q003", "Q004", "W191",
    # The other half of D211 / D212, which stay on.
    "D203", "D213",
    # Its notice pattern needs a year, and shipped source carries no dates
    # (tests/repo_hygiene_test.py).
    "CPY001",
    # Wants a custom exception class per message; the messages are plain strings by
    # design (one stable text per failure mode, aggregated in the build log).
    "TRY003",
    # Counts keyword-only parameters too. PLR0917 (too many positional) stays on,
    # and keyword-only arguments are named at every call site.
    "PLR0913",
]
# Real typography in scraped titles and Japanese pages, which the patterns and test
# fixtures have to match literally.
allowed-confusables = ["–", "’", "（", "）", "［", "］", "×"]

[tool.ruff.lint.per-file-ignores]
# pytest's assert is its API; a test's expected values are the point of it; a test's
# name is its docstring; and basedpyright's reportPrivateUsage already gates private
# access, with an ignore at each site.
"tests/**" = ["S101", "PLR2004", "D1", "SLF001"]
# The scripts are command-line tools, and print is their output.
"scripts/**" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
# One import style across the package: absolute, as the parent-package ones must be.
ban-relative-imports = "all"
